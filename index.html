<html lang="he" dir="rtl">

<meta charset="utf-8">

<meta property="og:description" content="האפליקציה שאומרת לך מה התרגיל הבא בחדר הכושר: 4 הצעות לפי שלב האימון, הסבר לכל תרגיל ומפת שרירים.">
<meta property="og:url" content="https://salvinorin95.github.io/keeping-fitt/">
<meta property="og:image" content="https://salvinorin95.github.io/keeping-fitt/og-image.png">

<style>
/* Layout: built for a phone held in one hand at the gym, like a gym whiteboard. Header, workout chips, the root trail of what you did, a ruled 2x2 board of four moves, thumb dock. */
:root{
  --paper:#FFFFFF;
  --ink:#0D2638;
  --muted:#557081;
  --sky:#2FA8EE;
  --sky-deep:#0B6FAD;
  --sky-mid:#A6D7F6;
  --sky-soft:#EBF6FE;
  --gear:#CBE7FA;
  --rule:#D5E6F1;
  --scrim:rgba(13,38,56,.38);
  --on-accent:#FFFFFF;
  --font-display:'Secular One','Rubik',system-ui,sans-serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-util:'Barlow Condensed','Rubik',system-ui,sans-serif;
  --font-round:'Fredoka','Rubik',system-ui,sans-serif;
  --hit:#1E98E3;
  --hit2:#8CCBF4;
  --body:#C9D9E5;
  --body-2:#DCE6EE;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overscroll-behavior:none;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.tile,.dock,.splits,.seg,.trail,.ex-pic,.row{-webkit-user-select:none;user-select:none}
.tile,.ex-pic,.row{-webkit-touch-callout:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--sky-deep);outline-offset:2px}

#app{height:100%;min-height:540px;max-width:480px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
@media (min-width:520px){#app{border-inline:1.5px solid var(--rule)}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.mark{margin:0;font-family:var(--font-util);font-style:italic;font-weight:700;font-size:29px;line-height:1;letter-spacing:.005em;white-space:nowrap}
.mark span{color:var(--sky)}
.seg{display:flex;border:1.5px solid var(--rule);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:none;font-size:13.5px;font-weight:500;color:var(--muted);padding:7px 11px;border-radius:999px}
.seg button[aria-checked="true"]{background:var(--sky-soft);color:var(--sky-deep)}

/* workout chips */
.splits{display:flex;gap:6px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none}
.splits::-webkit-scrollbar{display:none}
.splits button{flex:none;border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.splits button b{font-family:var(--font-util);font-size:16px;font-weight:600;margin-inline-end:4px}
.splits button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-deep)}

/* trail */
.trail{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding-block:6px 10px;min-width:0}
.phases,.path{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0}
.phases::-webkit-scrollbar,.path::-webkit-scrollbar{display:none}
.phases{gap:14px;font-size:13px;color:var(--muted);white-space:nowrap;min-height:22px}
.sid{font-family:var(--font-util);font-weight:600;font-size:15px;color:var(--on-accent);background:var(--sky-deep);border-radius:6px;padding:0 7px;line-height:20px;flex:none}
.phase{display:flex;align-items:center;gap:5px;flex:none;font-family:var(--font-round);font-weight:500;font-size:14px}
.phase.now{color:var(--ink);font-weight:600}
.phase.done{color:var(--sky-deep);font-weight:600}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--sky-mid)}
.dots i.on{background:var(--sky);border-color:var(--sky)}
.path{min-height:34px}
.step{flex:none;display:flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;max-width:170px}
.step svg{width:26px;height:26px;flex:none}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{flex:none;width:12px;height:2px;background:var(--sky-mid)}
.time{flex:none;margin-inline-start:10px;font-family:var(--font-util);font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);white-space:normal}

/* board: four large tiles so the figure and the name own the screen */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));border-block:1.5px solid var(--rule)}
.cell{position:relative;min-width:0;min-height:0}
.cell:nth-child(odd){border-inline-end:1.5px solid var(--rule)}
.cell:nth-child(-n+2){border-bottom:1.5px solid var(--rule)}
.tile{border:0;background:var(--paper);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:36px 8px 12px;text-align:center;--halo:var(--paper);transition:background-color .15s}
.tile:active{background:var(--sky-soft);--halo:var(--sky-soft)}
.tile:focus-visible{outline-offset:-5px}
.tile .pic{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.tile .pic svg{height:100%;width:auto;max-width:100%;max-height:100%}
.tile .nm,.tile .en{flex:none;max-width:100%}
.tile .nm{font-family:var(--font-display);font-size:clamp(22px,6.2vw,28px);line-height:1.15;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .en{font-family:var(--font-util);font-weight:500;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.label{position:absolute;top:10px;inset-inline:48px;text-align:center;font-family:var(--font-round);font-weight:600;font-size:16.5px;line-height:24px;color:var(--sky-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.badge{position:absolute;top:12px;inset-inline-start:7px;font-family:var(--font-round);font-weight:600;font-size:11.5px;line-height:20px;padding:0 7px;border-radius:999px;background:var(--sky-soft);color:var(--sky-deep);pointer-events:none}
.tick{position:absolute;top:5px;inset-inline-end:5px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--sky-mid);background:var(--paper);color:var(--sky-deep);display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px}
.tick:active{background:var(--sky);border-color:var(--sky);color:var(--on-accent)}
.cell.enter .tile{animation:rise .34s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes rise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty-cell{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;padding:12px;text-align:center}

/* dock */
.dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px 12px}
.ghost{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;font-weight:500;color:var(--ink);padding:6px 4px}
.ghost svg{width:22px;height:22px;color:var(--sky-deep)}
.zap{border:0;background:var(--sky-deep);color:var(--on-accent);border-radius:999px;padding:12px 30px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 6px 18px rgba(11,111,173,.25)}
.zap svg{width:20px;height:20px}
.zap:active{transform:scale(.97)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(13,38,56,.2);animation:up .26s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0 12px;touch-action:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--rule);margin-inline-start:calc(50% - 32px)}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 20px 18px;min-height:0}
.sheet-actions{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--rule)}
.sheet-actions:empty{display:none}
.primary,.secondary{flex:1;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{border:0;background:var(--sky-deep);color:var(--on-accent)}
.primary svg{width:18px;height:18px}
.secondary{border:1.5px solid var(--rule);background:var(--paper);color:var(--ink)}
.note-done{flex:1;text-align:center;color:var(--muted);font-size:14px;align-self:center}

.ex-head{display:flex;gap:16px;align-items:center;padding-block:4px 14px}
.ex-pic-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:92px}
.ex-hint{font-size:11px;line-height:1.3;color:var(--muted);text-align:center}
.ex-pic{flex:none;width:88px;height:88px;border-radius:18px;background:var(--sky-soft);display:grid;place-items:center;--halo:var(--sky-soft)}
.ex-pic svg{width:76px;height:76px}
.map-card{background:var(--sky-soft);border-radius:20px;padding:12px 10px 10px;margin-bottom:10px}
.map-title{font-family:var(--font-round);font-weight:600;font-size:24px;line-height:1.2;text-align:center;color:var(--sky-deep);margin:0 0 6px}
.maps{display:flex;justify-content:center;gap:6px}
.maps figure{margin:0;flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;min-width:0}
.maps svg{width:100%;height:auto;max-height:270px;display:block}
.maps figcaption{font-family:var(--font-round);font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.mapsvg path{stroke:var(--sky-soft);stroke-width:1.1;stroke-linejoin:round}
.mapsvg .mb{fill:var(--body-2)}.mapsvg .m0{fill:var(--body)}.mapsvg .ms{fill:var(--hit2)}
.mapsvg .mp{fill:var(--hit);animation:hit .9s ease .1s both}
@keyframes hit{0%{fill:var(--body)}55%{fill:var(--sky)}100%{fill:var(--hit)}}
.legend{display:flex;justify-content:center;gap:18px;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend .lp{background:var(--hit)}.legend .ls{background:var(--hit2)}
.ex-title{min-width:0}
.ex-title h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.ex-title .en{font-family:var(--font-util);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:500;border:1.5px solid var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
.chip.t{border-color:var(--sky-mid);color:var(--sky-deep)}
.why{background:var(--sky-soft);border-radius:12px;padding:10px 14px;margin:0 0 6px;font-size:14.5px}
.why b{color:var(--sky-deep);margin-inline-end:4px}
.sec{padding-block:12px 4px;border-top:1.5px solid var(--rule);margin-top:10px}
.sec:first-of-type{border-top:0}
.sec h3,.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--sky-deep);margin:0 0 6px}
.sec ol,.sec ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.sec li{max-width:65ch}
.sec li::marker{color:var(--sky-deep);font-weight:600}
.err li::marker{color:var(--muted)}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.m1,.m2{font-size:13.5px;border-radius:8px;padding:3px 10px;border:1.5px solid var(--rule);display:inline-flex;align-items:center;gap:6px}
.m1{font-weight:500}
.m2{color:var(--muted)}
.m1::before,.m2::before{content:'';width:9px;height:9px;border-radius:3px;flex:none}
.m1::before{background:var(--hit)}.m2::before{background:var(--hit2)}
.rx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--rule);border:1.5px solid var(--rule);border-radius:12px;overflow:hidden;margin:0}
.rx div{background:var(--paper);padding:8px 6px;text-align:center;min-width:0}
.rx dt{font-size:11.5px;color:var(--muted)}
.rx dd{margin:0;font-family:var(--font-util);font-size:17px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.small{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:65ch}
details.pro{border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;margin-top:12px}
details.pro summary{font-weight:600;color:var(--sky-deep);cursor:pointer}
details.pro p{margin:8px 0 0;max-width:65ch}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts button{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13.5px}
.sum{font-family:var(--font-util);font-size:20px;font-weight:600;color:var(--sky-deep);margin:2px 0 10px}
.sumlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.sumlist li{display:flex;justify-content:space-between;border:1.5px solid var(--rule);border-radius:10px;padding:6px 12px}
.sumlist b{font-family:var(--font-util);font-size:18px;color:var(--sky-deep)}
h2.plain{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}

/* catalog */
.panel{position:fixed;inset:0;background:var(--paper);z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-in{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;gap:4px;padding-block:8px 8px}
.back{border:0;background:none;display:flex;align-items:center;gap:2px;color:var(--sky-deep);font-size:16px;font-weight:500;min-height:44px;padding:0 0 0 10px;margin-inline-start:-6px}
.back svg{width:24px;height:24px}
.panel-head h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--sky)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:11px 0;width:100%;min-width:0}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 14px;font-family:var(--font-round);font-size:15px;font-weight:500}
.cats button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-deep)}
.clist{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:24px}
.info{background:var(--sky-soft);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.info p{margin:0 0 10px;max-width:65ch}
.info details{border-top:1.5px solid var(--sky-mid);padding-top:8px}
.info summary{font-weight:600;color:var(--sky-deep);cursor:pointer}
.info details p{margin:6px 0 0}
.cgroup{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--font-round);font-weight:600;font-size:22px;color:var(--sky-deep);margin:18px 0 2px;padding-bottom:6px;border-bottom:1.5px solid var(--rule)}
.cgroup span{font-family:var(--font-round);font-weight:500;font-size:12.5px;color:var(--sky-deep);background:var(--sky-soft);border-radius:999px;padding:0 8px;line-height:20px}
.rpic{display:flex;flex:none}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1.5px solid var(--rule);background:var(--paper);padding:8px 2px;text-align:start;--halo:var(--paper)}
.row:active{background:var(--sky-soft);--halo:var(--sky-soft)}
.row svg{width:48px;height:48px;flex:none}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.rtx b{font-weight:600;font-size:15px}
.rtx small{font-size:12.5px;color:var(--muted)}
.rtx .en2{font-family:var(--font-util);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.lv{display:flex;gap:3px;flex:none}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.lv i.on{background:var(--sky)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;z-index:40;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(13,38,56,.25)}
.toast button{border:0;background:none;color:var(--sky-mid);font-weight:600;padding:4px 6px}

/* pictograms */
.pg{display:block;overflow:visible}
.pg polyline,.pg line,.pg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pg .b{stroke:var(--sky)}
.pg .f{stroke:var(--sky-mid)}
.pg .halo{stroke:var(--halo,var(--paper))}
.pg .hd{fill:var(--sky)}
.pg .gp{stroke:var(--gear)}
.pg .gr{stroke:var(--sky-mid)}
.pg .gl{fill:var(--gear);stroke:var(--sky-mid);stroke-width:2.5}
.pg .gh,.pg .gd{fill:var(--sky-mid)}
.pg .gc{stroke:var(--sky-mid);stroke-width:1.6}
.pg .pul{fill:var(--paper);stroke:var(--sky-mid);stroke-width:2}
.pg .fl{stroke:var(--rule);stroke-width:2}
.pg .rc{fill:var(--gear);stroke:var(--sky-mid);stroke-width:1.5}
.pg .mo{stroke:var(--sky-mid);stroke-width:2;stroke-dasharray:2.5 4.5}

.iconsheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:16px}
.iconsheet figure{margin:0;border:1px solid var(--rule)}
.iconsheet figcaption{font-size:11px;text-align:center;color:var(--muted)}

@media (hover:none){.hint-mouse{display:none}}
@media (hover:hover){
  .hint-touch{display:none}
  .tile:hover{background:var(--sky-soft);--halo:var(--sky-soft)}
  .tick:hover{background:var(--sky-soft)}
  .icon-btn:hover,.row:hover{background:var(--sky-soft);--halo:var(--sky-soft)}
  .alts button:hover{border-color:var(--sky)}
}
@media (prefers-reduced-motion:reduce){

function P(a){let s='';for(let i=0;i<a.length;i+=2)s+=(i?' ':'')+a[i]+','+a[i+1];return s}
function limb(a,cls,w,halo){
  let s='';
  if(halo&&a.length>=4){const x=a[0]+(a[2]-a[0])*.5,y=a[1]+(a[3]-a[1])*.5;s+=`<polyline class="halo" stroke-width="${w+4}" points="${P([x,y,...a.slice(2)])}"/>`}
  return s+`<polyline class="${cls}" stroke-width="${w}" points="${P(a)}"/>`;
}
function ln(c,v,w){return `<line class="${c}" x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}"${w?` stroke-width="${w}"`:''}/>`}
function gear(str){
  const [k,...r]=str.split(' '),v=r.map(Number);
  switch(k){
    case 'pad':return ln('gp',v,6);
    case 'rod':return ln('gr',v,3);
    case 'beam':return ln('gr',v,5);
    case 'handle':return ln('gr',v,4);
    case 'plate':return `<circle class="gl" cx="${v[0]}" cy="${v[1]}" r="${v[2]}"/><circle class="gh" cx="${v[0]}" cy="${v[1]}" r="${Math.max(1.6,v[2]/4)}"/>`;
    case 'db':{const [x,y]=v;return ln('gr',[x-6,y,x+6,y],3)+`<rect class="gd" x="${x-9}" y="${y-5}" width="4.5" height="10" rx="1.5"/><rect class="gd" x="${x+4.5}" y="${y-5}" width="4.5" height="10" rx="1.5"/>`}
    case 'dbv':{const [x,y]=v;return ln('gr',[x,y-6,x,y+6],3)+`<rect class="gd" x="${x-5}" y="${y-9}" width="10" height="4.5" rx="1.5"/><rect class="gd" x="${x-5}" y="${y+4.5}" width="10" height="4.5" rx="1.5"/>`}
    case 'bar':{const [x1,y,x2]=v;return ln('gr',[x1,y,x2,y],3.5)+`<rect class="gl" x="${x1}" y="${y-9}" width="5" height="18" rx="1.5"/><rect class="gl" x="${x2-5}" y="${y-9}" width="5" height="18" rx="1.5"/>`}
    case 'cable':return ln('gc',v)+`<circle class="pul" cx="${v[0]}" cy="${v[1]}" r="3.2"/>`;
    case 'floor':return ln('fl',[6,v[0],94,v[0]]);
    case 'rect':return `<rect class="rc" x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" rx="4"/>`;
  }
  return '';
}
const PIC_CACHE={};
function pic(id){return PIC_CACHE[id]||(PIC_CACHE[id]=drawPose(POSES[id]||POSES.bench))}
function drawPose(p){
  let s='<svg class="pg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">';
  (p.g||[]).forEach(x=>s+=gear(x));
  (p.fl||[]).forEach(a=>s+=limb(a,'f',7));
  (p.fa||[]).forEach(a=>s+=limb(a,'f',6.5));
  s+=limb(p.t,'b',10);
  (p.l||[]).forEach(a=>s+=limb(a,'b',7.5));
  const head=`<circle class="hd" cx="${p.h[0]}" cy="${p.h[1]}" r="7"/>`;
  if(p.af) s+=head;
  (p.a||[]).forEach(a=>s+=limb(a,'b',7,1));
  if(!p.af) s+=head;
  (p.fg||[]).forEach(x=>s+=gear(x));
  (p.m||[]).forEach(d=>s+=`<path class="mo" d="${d}"/>`);
  return s+'</svg>';
}

/* the muscle names used in the exercise data, mapped onto map regions */
function regionsOf(txt){
  const has=k=>txt.includes(k),r=[];
  if(has('חזה')) r.push(...(has('עליון')?['chestU']:has('תחתון')?['chestL']:['chestU','chestL']));
  if(has('כתף קדמית')) r.push('deltF');
  if(has('כתף צידית')) r.push('deltS');
  if(has('כתף אחורית')) r.push('deltR');
  if(txt==='כתפיים') r.push('deltF','deltS','deltR');
  if(has('יד אחורית')||has('יד האחורית')||has('ראש צידי')) r.push('triceps');
  if(has('יד קדמית')||has('ברכיאליס')) r.push('biceps');
  if(has('ברכיורדיאליס')||has('אמה')||has('שרירי הזרוע')||has('אחיזה')) r.push('forearm');
  if(has('רחב גבי')||has('טרס')) r.push('lats');
  if(has('גב עליון')||has('מעוינים')||has('סופרהספינטוס')||has('מסובבים')) r.push('upperback');
  if(has('טרפז')) r.push('traps');
  if(has('זוקפי גו')||has('ריבועי')) r.push('lowerback');
  if(has('ארבע ראשי')||has('ישר הירך')||has('מכופפי ירך')) r.push('quads');
  if(has('מקרבים')) r.push('adductors');
  if(has('ירך אחורית')) r.push('hams');
  if(has('ישבן')||has('מייצבי אגן')||has('TFL')) r.push('glutes');
  if(has('תאומים')||has('סוליה')) r.push('calves');
  if(has('ישר הבטן')||has('בטן רוחבית')) r.push('abs');
  if(has('אלכסוניים')||has('סראטוס')) r.push('obliques');
  if(has('ליבה')) r.push('abs','obliques');
  return r;
}
function regionsFor(e){
  const P=new Set(),S=new Set();
  e.m.forEach(x=>regionsOf(x).forEach(r=>P.add(r)));
  e.s.forEach(x=>regionsOf(x).forEach(r=>{if(!P.has(r)) S.add(r)}));
  return {P,S};
}
function bodySvg(view,P,S){
  const cls=r=>r?(P.has(r)?'mp':S.has(r)?'ms':'m0'):'mb';
  let center='',half='';
  BODY[view].forEach(([r,d,c])=>{const p=`<path class="${cls(r)}" d="${d}"/>`;if(c) center+=p;else half+=p});
  return `<svg class="mapsvg" viewBox="15 4 90 216" aria-hidden="true" focusable="false">${center}${half}<g transform="translate(120 0) scale(-1 1)">${half}</g></svg>`;
}

/* overlays: each open sheet or catalog adds a history entry, so the phone's back button closes it */
const stack=[];let useHist=true;
function pushOverlay(n){
  stack.push({n,f:document.activeElement});
  if(useHist){try{history.pushState({kf:stack.length},'')}catch(e){useHist=false}}
}
function hide(n){if(n==='sheet'){$('#scrim').hidden=true;$('.sheet').style.transform=''}else $('#catalog').hidden=true}
function collapse(d){
  let f=null;
  while(stack.length>d){const o=stack.pop();hide(o.n);f=o.f}
  if(f&&document.contains(f)&&!f.closest('[hidden]')) try{f.focus({preventScroll:true})}catch(e){}
}
function closeTo(d){
  const n=stack.length-d;if(n<=0) return;
  if(!useHist){collapse(d);return}
  const before=stack.length;
  try{history.go(-n)}catch(e){useHist=false;collapse(d);return}
  setTimeout(()=>{if(stack.length===before){useHist=false;collapse(d)}},400);
}
window.addEventListener('popstate',ev=>{const d=ev.state&&ev.state.kf?ev.state.kf:0;if(d<stack.length) collapse(d)});
const depthOf=n=>stack.findIndex(o=>o.n===n);
const closeSheet=()=>{const i=depthOf('sheet');if(i>=0) closeTo(i)};
const closeCatalog=()=>{const i=depthOf('catalog');if(i>=0) closeTo(i)};

/* exercise motion: while a mouse rests on a figure, or a finger presses it, the figure eases to the other end of the movement and back */
const PERIOD=1700,reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const running=new Map();let raf=0;
function animStart(el){
  if(!el||reduceMotion||running.has(el)||!MOVES[el.dataset.anim]) return;
  running.set(el,performance.now());
  if(!raf) raf=requestAnimationFrame(animTick);
}
function animStop(el){
  if(!el||!running.has(el)) return;
  running.delete(el);el.innerHTML=pic(el.dataset.anim);
}
function animTick(now){
  running.forEach((t0,el)=>{
    if(!el.isConnected){running.delete(el);return}
    const s=(1-Math.cos((now-t0)/PERIOD*2*Math.PI))/2;
    el.innerHTML=drawPose(poseAt(el.dataset.anim,s));
  });
  raf=running.size?requestAnimationFrame(animTick):0;
}
const HOSTS='.cell,.ex-pic,.row';
const animOf=t=>{const h=t&&t.closest?t.closest(HOSTS):null;return h?(h.matches('[data-anim]')?h:h.querySelector('[data-anim]')):null};
document.addEventListener('pointerover',ev=>{if(ev.pointerType==='mouse') animStart(animOf(ev.target))});
document.addEventListener('pointerout',ev=>{
  if(ev.pointerType!=='mouse') return;
  const h=ev.target.closest?ev.target.closest(HOSTS):null;
  if(h&&!(ev.relatedTarget&&h.contains(ev.relatedTarget))) animStop(animOf(ev.target));
});
let press=null,suppressClick=false;
document.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse') return;
  const el=animOf(ev.target);if(!el) return;
  press={el,t:performance.now()};animStart(el);
});
const endPress=ev=>{
  if(!press) return;
  if(ev.type==='pointerup'&&performance.now()-press.t>450){suppressClick=true;setTimeout(()=>{suppressClick=false},600)}
  animStop(press.el);press=null;
};
document.addEventListener('pointerup',endPress);
document.addEventListener('pointercancel',endPress);
document.addEventListener('contextmenu',ev=>{if(ev.target.closest&&ev.target.closest(HOSTS)) ev.preventDefault()});

let swiped=false;
document.addEventListener('click',ev=>{

  if(el.dataset.split){st.split=el.dataset.split;st.zap=0;st.prev=[];save();refresh(true);return}
  if(el.dataset.tick!=null){if(swiped) return;markDone(view.items[+el.dataset.tick].ex.id);return}
  if(el.classList.contains('tile')){if(swiped) return;const it=view.items[+el.dataset.i];openEx(it.ex.id,it.reason);return}
  if(el.dataset.step!=null){const d=st.done[+el.dataset.step];if(d) openEx(d.id);return}
  if(el.dataset.open){openEx(el.dataset.open);return}
  if(el.dataset.cat){cat=el.dataset.cat;renderCatalog();$('#clist').scrollTop=0;return}
  const act=el.dataset.act;
  if(act==='done'){markDone(el.dataset.id);closeTo(0);return}
  if(act==='remove'){const id=el.dataset.id;removeDone(id);closeSheet();toast(`הוסר מהמסלול: ${EX[id].he}`);return}
  if(act==='reset'){reset();return}
  if(act==='close'){closeSheet();return}
});
$('#zap').addEventListener('click',zap);
$('#finish').addEventListener('click',openFinish);
$('#openCat').addEventListener('click',openCatalog);
$('#catClose').addEventListener('click',closeCatalog);
$('#sheetClose').addEventListener('click',closeSheet);
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim') closeSheet()});
$('#q').addEventListener('input',renderCatalog);
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter') ev.target.blur()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&stack.length) closeTo(stack.length-1)});

/* swipe the board sideways to zap */
const board=$('#board');let sx=0,sy=0;
board.addEventListener('touchstart',ev=>{const p=ev.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
board.addEventListener('touchend',ev=>{
  const p=ev.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dy)<45){swiped=true;zap();setTimeout(()=>{swiped=false},400)}
},{passive:true});

/* drag the exercise sheet down to close it */
const sheet=$('.sheet'),sbody=$('#sheetBody');let y0=null,dragging=false;
sheet.addEventListener('touchstart',ev=>{
  const fromTop=!!ev.target.closest('.sheet-top');
  y0=(fromTop||sbody.scrollTop<=0)&&!ev.target.closest('.sheet-actions')?ev.touches[0].clientY:null;dragging=false;
},{passive:true});
sheet.addEventListener('touchmove',ev=>{
  if(y0==null) return;
  const d=ev.touches[0].clientY-y0;
  if(!dragging&&d<-4){y0=null;return}
  if(d>8){dragging=true;sheet.style.transition='none';sheet.style.transform=`translateY(${d}px)`;ev.preventDefault()}
},{passive:false});
sheet.addEventListener('touchend',ev=>{
  if(y0==null) return;
  const d=ev.changedTouches[0].clientY-y0;
  sheet.style.transition='transform .2s ease';
  if(dragging&&d>90){sheet.style.transform='translateY(100%)';setTimeout(()=>{sheet.style.transition='';closeSheet()},180)}
  else sheet.style.transform='';
  y0=null;dragging=false;
});

setInterval(()=>{const el=document.getElementById('elapsed');if(el) el.textContent=minutes()+' דק׳'},30000);

refresh(false);

})();
</script>

<div class="install" id="install" dir="rtl" lang="he" role="dialog" aria-labelledby="installText" hidden>
  <p id="installText"></p>
  <div class="install-actions"><button type="button" class="primary" id="installGo">התקן</button><button type="button" class="secondary" id="installLater">לא עכשיו</button></div>
</div>
<script>
/* offline support, and a one-time offer to add the app to the home screen */
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function(){
  const KEY='kf.install.dismissed';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  let dismissed=false;try{dismissed=localStorage.getItem(KEY)==='1'}catch(e){}
  if(standalone||dismissed) return;
  const box=document.getElementById('install'),txt=document.getElementById('installText'),go=document.getElementById('installGo'),later=document.getElementById('installLater');
  const hide=()=>{box.hidden=true;try{localStorage.setItem(KEY,'1')}catch(e){}};
  later.onclick=hide;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){
    txt.innerHTML='להתקנה באייפון: לחץ על כפתור השיתוף (ריבוע עם חץ למעלה) ובחר <b>הוסף למסך הבית</b>. האפליקציה תיפתח במסך מלא ותעבוד גם בלי אינטרנט.';
    go.textContent='הבנתי';go.onclick=hide;later.hidden=true;
    setTimeout(()=>{box.hidden=false},2500);return;
  }
  let deferred=null;
  addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferred=ev;txt.textContent='אפשר להתקין את Keeping Fit על הטלפון ולפתוח אותה כמו אפליקציה, גם בלי אינטרנט.';box.hidden=false});
  go.onclick=async()=>{if(!deferred) return hide();deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;hide()};
  addEventListener('appinstalled',hide);
})();
</script>
